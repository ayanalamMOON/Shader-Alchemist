name: Benchmark Suite

on:
  workflow_dispatch:
    inputs:
      skip_harness:
        description: "Skip WebGPU execution and only generate candidate artifacts"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  benchmark:
    name: Generate benchmark evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: packages/agent-core/pyproject.toml
      - name: Install agent core
        run: uv sync --project packages/agent-core
      - name: Install WebGPU harness dependencies
        working-directory: packages/webgpu-harness
        run: npm install --no-audit --no-fund
      - name: Build WebGPU harness
        working-directory: packages/webgpu-harness
        run: npm run build
      - name: Verify API credential
        if: ${{ !inputs.skip_harness }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "Set the GOOGLE_API_KEY repository secret or dispatch with skip_harness=true." >&2
            exit 1
          fi
      - name: Run reproducible benchmark manifest
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SHADER_ALCHEMIST_USE_ADK: "true"
          SHADER_ALCHEMIST_HARNESS_COMMAND: "node packages/webgpu-harness/dist/index.js"
        run: |
          args=()
          if [ "${{ inputs.skip_harness }}" = "true" ]; then
            args+=(--skip-harness)
          else
            args+=(--harness-command "$SHADER_ALCHEMIST_HARNESS_COMMAND")
          fi
          uv run --project packages/agent-core python scripts/benchmark_all_examples.py "${args[@]}"
      - name: Upload benchmark evidence
        if: always() && hashFiles('benchmark-results/summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: shader-alchemist-benchmark-${{ github.run_number }}
          path: benchmark-results/
          if-no-files-found: warn
