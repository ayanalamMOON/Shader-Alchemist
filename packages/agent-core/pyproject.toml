[project]
name = "shader-alchemist-agent-core"
version = "0.1.0"
description = "Agentic WebGPU shader synthesis, validation, and refinement pipeline"
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1",
  "pydantic>=2.0",
  "google-adk>=2.11.0",
  "google-genai>=2.29.0",
]

[project.scripts]
shader-alchemist = "shader_alchemist.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]